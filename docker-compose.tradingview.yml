# The TradingView webhook receiver, as an overlay on docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.tradingview.yml up -d
#
# Unlike the brain service this one DOES publish on a public interface,
# because TradingView's servers are the ones calling. That is the whole
# reason it is a second container: the brain holds broker credentials and is
# bound to loopback behind Tailscale, and nothing about it should change to
# accommodate an inbound webhook.
#
# Put TLS in front of it. TradingView will POST to plain http, but the shared
# secret travels in the request body, so http means the credential crosses
# the internet in clear text.

services:
  tradingview:
    build: .
    image: index-option-brain:local
    container_name: index-brain-tv
    restart: unless-stopped
    command: ["python", "-m", "index_option_brain.integrations.tradingview"]
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      # Behind a proxy or tunnel the peer address is the proxy, not
      # TradingView, so the address allowlist has to be turned off
      # explicitly and the secret becomes the only credential.
      TRADINGVIEW_ALLOWED_IPS: ${TRADINGVIEW_ALLOWED_IPS:-}
      TRADINGVIEW_WEBHOOK_PORT: ${TRADINGVIEW_WEBHOOK_PORT:-8787}
      BAR_STORE_DIR: ""
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Shares the database with the brain container: system_events is how
      # an accepted alert crosses the process boundary. On SQLite the two
      # writers are serialised by a file lock, which is why Database sets a
      # busy timeout — see index_option_brain/database/engine.py.
      - ./var:/app/var
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/tv/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
