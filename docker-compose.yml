# Always-on deployment with the console reachable only from your tailnet.
#
#   docker compose up -d
#
# The brain container publishes no host port. Its only route in is the
# Tailscale sidecar, which shares its network namespace — so the console is
# reachable at https://<machine>.<your-tailnet>.ts.net and from nowhere else.
# That matters more than usual here: this process will hold broker
# credentials, and a trading console on the public internet is a target.
#
# Set TS_AUTHKEY in .env from an ephemeral, pre-authorized, tagged auth key.

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: index-brain-ts
    hostname: ${TS_HOSTNAME:-index-brain}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      # Terminates TLS with a cert from your tailnet and proxies to the app.
      # `serve` is tailnet-only. `funnel` would put it on the public internet
      # — see deploy/README.md before considering that.
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=${TS_TAGS:-tag:index-brain}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 60s
      timeout: 10s
      retries: 3

  brain:
    build: .
    container_name: index-brain
    restart: unless-stopped
    # Shares the sidecar's network stack, which is what lets Tailscale reach
    # 127.0.0.1:8000 without the app being exposed on the host at all.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
    env_file:
      - .env
    environment:
      LLM_ENABLED: ${LLM_ENABLED:-false}
      RUN_MODE: ${RUN_MODE:-paper}
    # Read-only root with a tmpfs for scratch: nothing in this image needs to
    # write to disk, and a process holding credentials should not be able to.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Observed bars, so a restart does not go blind for a session. The root
      # filesystem is read-only, so this is the one writable path.
      - ./var:/app/var
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  tailscale-state:
