[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "index-option-brain"
version = "0.1.0"
description = "Production-grade Python-based Indian Index + Options trading brain (deterministic quant core, optional LLM investigation layer)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx2",
]

[tool.hatch.build.targets.wheel]
packages = ["index_option_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = false
